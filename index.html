<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="TaskFlow is a simple, focused task manager.">
  <title>TaskFlow — Todo List</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app-shell">
    <header class="app-header">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">✓</span>
        <div>
          <h1>TaskFlow</h1>
          <p>Organize your work. Stay in control.</p>
        </div>
      </div>
      <button class="theme-toggle icon-button" id="themeToggle" type="button" aria-label="Switch to dark mode" title="Switch theme">
        <span aria-hidden="true">☾</span>
      </button>
    </header>

    <section class="task-composer card" aria-labelledby="new-task-heading">
      <div class="section-heading">
        <div>
          <p class="eyebrow">YOUR TASKS</p>
          <h2 id="new-task-heading">What needs to be done?</h2>
        </div>
      </div>
      <form id="taskForm" novalidate>
        <label class="sr-only" for="taskInput">Task title</label>
        <input id="taskInput" name="task" type="text" maxlength="120" autocomplete="off" placeholder="e.g. Prepare project presentation" required>
        <div class="composer-details">
          <div class="field-group">
            <label for="priorityInput">Priority</label>
            <select id="priorityInput" name="priority">
              <option value="medium" selected>Medium</option>
              <option value="high">High</option>
              <option value="low">Low</option>
            </select>
          </div>
          <div class="field-group">
            <label for="dueDateInput">Due date <span class="optional">optional</span></label>
            <input id="dueDateInput" name="dueDate" type="date">
          </div>
          <button class="primary-button" type="submit"><span aria-hidden="true">+</span> Add task</button>
        </div>
        <p class="form-message" id="formMessage" role="alert" aria-live="polite"></p>
      </form>
    </section>

    <section class="workspace card" aria-labelledby="tasks-heading">
      <div class="workspace-top">
        <div>
          <p class="eyebrow">OVERVIEW</p>
          <h2 id="tasks-heading">My tasks</h2>
        </div>
        <div class="stats" aria-label="Task statistics">
          <span><strong id="totalCount">0</strong> total</span>
          <span class="stat-divider" aria-hidden="true"></span>
          <span><strong id="completedCount">0</strong> completed</span>
        </div>
      </div>

      <div class="task-tools">
        <div class="search-wrap">
          <span aria-hidden="true">⌕</span>
          <label class="sr-only" for="searchInput">Search tasks</label>
          <input id="searchInput" type="search" placeholder="Search tasks">
        </div>
        <div class="filters" role="group" aria-label="Filter tasks">
          <button class="filter-button active" type="button" data-filter="all" aria-pressed="true">All</button>
          <button class="filter-button" type="button" data-filter="active" aria-pressed="false">Active</button>
          <button class="filter-button" type="button" data-filter="completed" aria-pressed="false">Completed</button>
        </div>
      </div>

      <ul id="taskList" class="task-list" aria-live="polite"></ul>
      <div id="emptyState" class="empty-state" hidden>
        <div class="empty-icon" aria-hidden="true">✓</div>
        <h3 id="emptyTitle">No tasks yet</h3>
        <p id="emptyText">Add your first task above to get your day moving.</p>
      </div>
    </section>
  </main>

  <template id="taskTemplate">
    <li class="task-item">
      <label class="check-control">
        <input class="task-checkbox" type="checkbox">
        <span class="checkmark" aria-hidden="true">✓</span>
        <span class="sr-only">Mark task as complete</span>
      </label>
      <div class="task-content">
        <p class="task-title"></p>
        <div class="task-meta">
          <span class="priority-badge"></span>
          <span class="due-date"></span>
        </div>
      </div>
      <div class="task-actions">
        <button class="icon-button edit-button" type="button" aria-label="Edit task" title="Edit task">✎</button>
        <button class="icon-button delete-button" type="button" aria-label="Delete task" title="Delete task">×</button>
      </div>
    </li>
  </template>

  <div id="editDialog" class="modal-backdrop" hidden>
    <section class="edit-modal" role="dialog" aria-modal="true" aria-labelledby="edit-heading">
      <div class="modal-header"><h2 id="edit-heading">Edit task</h2><button id="closeEdit" class="icon-button" type="button" aria-label="Close edit dialog">×</button></div>
      <form id="editForm" novalidate>
        <label for="editTaskInput">Task title</label>
        <input id="editTaskInput" name="editTask" type="text" maxlength="120" required>
        <div class="edit-fields">
          <div><label for="editPriorityInput">Priority</label><select id="editPriorityInput"><option value="low">Low</option><option value="medium">Medium</option><option value="high">High</option></select></div>
          <div><label for="editDueDateInput">Due date</label><input id="editDueDateInput" type="date"></div>
        </div>
        <div class="modal-actions"><button id="cancelEdit" class="secondary-button" type="button">Cancel</button><button class="primary-button" type="submit" form="editForm">Save changes</button></div>
      </form>
    </section>
  </div>
  <script src="script.js"></script>
</body>
</html>
